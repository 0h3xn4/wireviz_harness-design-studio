name: harness-design-studio sources

# Runs the source step of the release workflow without a release: it builds the Linux package
# the same way, makes its inventory, and fetches the corresponding source of the LGPL and GPL
# components (tools/fetch_sources.py, decision D-213). Then it builds the release bundle from them
# twice (tools/release_bundle.py, D-232), with stand-ins for the files only a release makes (the
# Windows inventory, the signatures, the offline-audit report), checks it and compares the two
# builds byte for byte. It publishes nothing and keeps nothing but a short listing. Before this workflow, the step ran only on a release tag, so each fix
# needed a new release candidate (1.17.1rc1 and rc2 stopped there).
on:
  pull_request:
    paths:
      - "HarnessDesignStudio/tools/fetch_sources.py"
      - "HarnessDesignStudio/tools/third_party.py"
      - "HarnessDesignStudio/tools/build_installer.py"
      - "HarnessDesignStudio/tools/release_bundle.py"
      - "HarnessDesignStudio/tools/release_notes.py"
      - ".github/workflows/harness-sources.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-sources-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Qt system libraries (as the release workflow)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m tools.build_installer
      - name: Inventory of the package
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m tools.third_party inventory dist/harness-design-studio --format linux --version "$version" --out dist/legal
      - name: Source of the LGPL and GPL components (as the release workflow)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          python -m tools.fetch_sources dist/legal/third-party-inventory-*-linux.json --out dist/sources
          cat dist/sources/SOURCES.txt
          du -sh dist/sources
      - name: The release bundle, dry (as the release workflow, with stand-ins; nothing is published)
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for f in json md; do
            echo "stand-in" > "dist/legal/third-party-inventory-${version}-windows.$f"
            echo "stand-in" > "dist/offline-audit-${version}.$f"
          done
          echo "stand-in" > dist/legal/THIRD_PARTY_NOTICES-windows.txt
          echo "{}" > "dist/legal/sbom-${version}-windows.cdx.json"
          for f in "harness-design-studio_${version}_amd64.deb" "harness-design-studio-${version}-linux-x86_64.tar.gz" \
                   "harness-design-studio-${version}-windows-x86_64-setup.exe" "harness-design-studio-${version}-windows-x86_64.zip" \
                   "sbom-${version}-linux.cdx.json" "sbom-${version}-windows.cdx.json"; do
            echo "{}" > "dist/$f.sigstore.json"
          done
          python -m tools.release_bundle build dist --version "$version" --out "$RUNNER_TEMP/a.tar"
          python -m tools.release_bundle build dist --version "$version" --out "$RUNNER_TEMP/b.tar"
          cmp "$RUNNER_TEMP/a.tar" "$RUNNER_TEMP/b.tar"
          python -m tools.release_bundle check "$RUNNER_TEMP/a.tar" --version "$version"
          tar -tvf "$RUNNER_TEMP/a.tar" | grep -v '/sources/'
          ls -l "$RUNNER_TEMP/a.tar"
